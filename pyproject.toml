[project]
name = "opzioni"
version = "0.2.0"
description = "Strumenti in sola lettura (e un modello per gli ordini) per operare in opzioni su Interactive Brokers: dashboard, ricerca di occasioni, aggiustamenti, valore atteso statistico"
requires-python = ">=3.11"
dependencies = [
    "ib_async>=2.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "requests>=2.31",
    "yfinance>=0.2.40",
    "pyarrow>=16",
]

[tool.uv]
package = false
